# docker-compose.prod.yml
# Note: This file requires a .env file. Please copy .env.example to .env and adjust values if needed.
services:
  # Backend Node.js Service
  backend:
    build:
      context: ./backend
      target: production
    container_name: tomcruise_backend_prod
    restart: always
    ports:
      - "${PORT:-4000}:${PORT:-4000}"
    depends_on:
      - mongo
    environment:
      - MONGO_URL=${MONGO_URL}
      - PORT=${PORT:-4000}
      - NODE_ENV=production
    networks:
      - internal_net
      - default

  # Frontend React Service (Nginx)
  frontend:
    build:
      context: ./frontend
      target: production
    container_name: tomcruise_frontend_prod
    restart: always
    ports:
      - "80:80"
    depends_on:
      - backend
    networks:
      - default

  # MongoDB Database Service
  mongo:
    image: "mongo:5.0"
    container_name: tomcruise_mongo_prod
    restart: always
    volumes:
      - mongo_data_prod:/data/db
    networks:
      - internal_net

volumes:
  mongo_data_prod:

networks:
  internal_net:
    internal: true
