# docker-compose.prod.yml
# Note: This file requires a .env file. Please copy .env.example to .env and adjust values if needed.
# Both images build from the repository root (one root package-lock.json for the npm workspaces).
services:
  # Backend Node.js Service
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
      target: production
    container_name: tomcruise_backend_prod
    restart: always
    ports:
      - "${PORT:-4000}:${PORT:-4000}"
    depends_on:
      - mongo
    environment:
      - MONGO_URL=${MONGO_URL}
      - PORT=${PORT:-4000}
      - NODE_ENV=production
    networks:
      - internal_net
      - default

  # Frontend React Service (unprivileged nginx on :8080)
  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      target: production
      args:
        # Required: the production build refuses to fall back to localhost.
        VITE_API_URL: ${VITE_API_URL}
    container_name: tomcruise_frontend_prod
    restart: always
    ports:
      - "80:8080"
    depends_on:
      - backend
    networks:
      - default

  # MongoDB Database Service
  mongo:
    image: "mongo:5.0"
    container_name: tomcruise_mongo_prod
    restart: always
    volumes:
      - mongo_data_prod:/data/db
    networks:
      - internal_net

volumes:
  mongo_data_prod:

networks:
  internal_net:
    internal: true
