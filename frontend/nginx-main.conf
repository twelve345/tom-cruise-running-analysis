# nginx main configuration for the frontend image (installed as /etc/nginx/nginx.conf).
#
# The image runs as an unprivileged user (uid 65532), so there is no `user` directive.
# Everything nginx writes at runtime goes to /tmp or stdio: the pid file, the temp paths,
# and the error and access logs (the container log stream).
worker_processes  auto;
pid               /tmp/nginx.pid;
error_log         /dev/stderr notice;

events {
    worker_connections  1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" "$http_x_forwarded_for"';
    access_log  /dev/stdout  main;

    sendfile           on;
    keepalive_timeout  65;

    client_body_temp_path  /tmp/nginx-client-body;
    proxy_temp_path        /tmp/nginx-proxy;
    fastcgi_temp_path      /tmp/nginx-fastcgi;
    uwsgi_temp_path        /tmp/nginx-uwsgi;
    scgi_temp_path         /tmp/nginx-scgi;

    include  /etc/nginx/conf.d/*.conf;
}
