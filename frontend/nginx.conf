# Server block for the SPA (installed as /etc/nginx/conf.d/default.conf). Unprivileged
# nginx can't bind :80, so it listens on 8080; the Railway domain targets that port.
server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Client-side routing: unknown paths fall back to the app shell.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
