# docker-compose.yml
# Note: This file requires a .env file. Please copy .env.example to .env and adjust values if needed.
# Both images build from the repository root (one root package-lock.json for the npm workspaces).
services:
  # Backend Node.js Service
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
      target: development
    container_name: tomcruise_backend
    ports:
      - "${PORT:-4000}:${PORT:-4000}"
    volumes:
      - ./backend:/app/backend
      - /app/backend/node_modules
    depends_on:
      - mongo
    environment:
      - MONGO_URL=${MONGO_URL}
      - PORT=${PORT:-4000}
      - NODE_ENV=${NODE_ENV:-development}

  # Frontend React Service
  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      target: development
    container_name: tomcruise_frontend
    ports:
      - "3000:5173"
    volumes:
      - ./frontend:/app/frontend
      - /app/frontend/node_modules
    environment:
      - VITE_API_URL=${VITE_API_URL}

  # MongoDB Database Service
  mongo:
    image: "mongo:5.0"
    container_name: tomcruise_mongo
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

volumes:
  mongo_data:
