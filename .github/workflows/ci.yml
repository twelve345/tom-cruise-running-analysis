name: CI

on:
  pull_request:
    branches: [main, dev]
  push:
    branches: [main, dev]

permissions:
  contents: read

jobs:
  test:
    name: Test & Build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # The Node version lives in .nvmrc (one pin for CI, Docker and local dev).
      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run linters (strict)
        run: |
          echo "→ Linting backend..."
          npm run lint --workspace=backend -- --max-warnings=0
          echo "→ Linting frontend..."
          npm run lint --workspace=frontend -- --max-warnings=0

      # frontend/tsconfig.json is a solution file ("files": [] plus references), so a plain
      # `tsc --noEmit` checks nothing; `tsc -b` builds the referenced projects.
      - name: TypeScript type check
        run: |
          echo "→ Running TypeScript type check..."
          cd frontend && npx tsc -b

      - name: Run backend tests
        run: |
          echo "→ Running backend tests..."
          npm run test --workspace=backend

      - name: Run frontend tests
        run: |
          echo "→ Running frontend tests..."
          npm run test --workspace=frontend -- --run

      - name: Build frontend
        run: |
          echo "→ Building frontend..."
          npm run build --workspace=frontend

      - name: Check for secrets
        run: |
          echo "→ Scanning for secrets..."
          npx secretlint "**/*"

      - name: Summary
        if: success()
        run: |
          echo "✅ All CI checks passed!"
          echo ""
          echo "✓ Linting passed"
          echo "✓ TypeScript type check passed"
          echo "✓ Tests passed"
          echo "✓ Build passed"
          echo "✓ No secrets detected"
